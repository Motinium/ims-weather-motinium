name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  library:
    name: "Library smoke tests"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Set up Python"
        uses: "actions/setup-python@v6.3.0"
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "Install dependencies"
        run: python -m pip install --upgrade pip pytest pytz requests

      - name: "Run tests"
        run: python -m pytest tests/test_library.py -v

  digest:
    # Runs against both ends of the supported Home Assistant range. An
    # unpinned install lets the resolver pick whatever it likes (it landed on
    # an old 2026.2 once), which hid that the PM10 constant differs by version.
    name: "Digest rules (HA ${{ matrix.label }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Manifest minimum. UnitOfDensity does not exist here, so this
          # exercises the deprecated-constant fallback in sensor.py.
          - label: "2025.4 min"
            python-version: "3.13"
            ha: "homeassistant==2025.4.0"
          # Latest. UnitOfDensity is present, exercising the primary import.
          - label: "latest"
            python-version: "3.14"
            ha: "homeassistant"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Set up Python"
        uses: "actions/setup-python@v6.3.0"
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      # The digest lives in the integration, so these need Home Assistant.
      - name: "Install dependencies"
        run: python -m pip install --upgrade pip pytest pytz requests "${{ matrix.ha }}"

      - name: "Run tests"
        run: python -m pytest tests/test_digest.py -v
