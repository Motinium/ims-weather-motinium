name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  library:
    name: "Library smoke tests"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Set up Python"
        uses: "actions/setup-python@v6.3.0"
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "Install dependencies"
        run: python -m pip install --upgrade pip pytest pytz requests

      - name: "Run tests"
        run: python -m pytest tests/test_library.py -v

  digest:
    name: "Digest rules"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.0"

      - name: "Set up Python"
        uses: "actions/setup-python@v6.3.0"
        with:
          python-version: "3.13"
          cache: "pip"

      # The digest lives in the integration, so these need Home Assistant.
      - name: "Install dependencies"
        run: python -m pip install --upgrade pip pytest pytz requests homeassistant

      - name: "Run tests"
        run: python -m pytest tests/test_digest.py -v
